<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ILS Automated Test Suite</title>
</head>
<body>
    <h1>ILS Automated Test Suite</h1>
    <div id="output">Running tests...</div>

    <script>
        window.addEventListener('error', function(e) {
            console.error("Global Error:", e.message, e.filename, e.lineno);
            fetch('/test-results', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ success: false, error: `${e.message} at ${e.filename}:${e.lineno}`, stack: e.error ? e.error.stack : '' })
            });
        });
        window.addEventListener('unhandledrejection', function(e) {
            console.error("Unhandled Rejection:", e.reason);
            fetch('/test-results', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ success: false, error: String(e.reason), stack: e.reason ? e.reason.stack : '' })
            });
        });
    </script>

    <script type="module">
        import { Aeronave } from '../Aeronave.js';
        import { state } from '../state.js';
        import { 
            getRunwayILS, 
            calculate_gs_vs, 
            calculateILSGeometry, 
            update_ils_tracking, 
            ILS_LATERAL_MODES, 
            ILS_VERTICAL_MODES, 
            ILS_CONSTANTS 
        } from '../ILSController.js';
        import { aerodromos, getRunwayILSData } from '../data.js';
        import { menuNivelUI } from '../ui.js';
        import { authorize_approach } from '../ApproachProfileManager.js';
        import { inicializarEspacoAereo } from '../engine.js';

        // Setup mock canvas for state and rendering
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 800;
        state.canvas = canvas;
        state.ctx = canvas.getContext('2d');
        state.largura = 1200;
        state.altura = 800;
        state.zoom = 1.0;
        state.panX = 0;
        state.panY = 0;
        state.rotas = {};
        state.pistas = [];
        state.fixos = {};
        state.aeronaves = [];

        // Populate airspace fixos and runways
        inicializarEspacoAereo();

        const capturedLogs = [];
        const origLog = console.log;
        const origErr = console.error;
        console.log = (...args) => {
            capturedLogs.push(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
            origLog.apply(console, args);
        };
        console.error = (...args) => {
            capturedLogs.push("[ERROR] " + args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
            origErr.apply(console, args);
        };

        const results = [];

        function assert(condition, message) {
            if (!condition) {
                const err = new Error(`Assertion failed: ${message}`);
                console.error(err);
                throw err;
            }
            console.log(`[PASS] ${message}`);
            results.push({ pass: true, message });
        }

        async function runTests() {
            try {
                console.log("=== STARTING ILS TEST SUITE ===");

                // TEST 1: Data-driven ILS Configuration
                console.log("\n--- TEST 1: Data-driven Configuration ---");
                const ils17R = getRunwayILSData("SBSP", "17R");
                assert(ils17R !== null, "SBSP 17R ILS config exists");
                assert(ils17R.enabled === true, "SBSP 17R ILS is enabled");
                assert(ils17R.freq === "109.5", "SBSP 17R freq is 109.5");
                assert(ils17R.frontCourseDeg === 170, "SBSP 17R front course is 170°");
                assert(ils17R.gs_angle_deg === 3.0, "SBSP 17R GS angle is 3.0°");

                const ils10R = getRunwayILSData("SBGR", "10R");
                assert(ils10R !== null, "SBGR 10R ILS config exists");
                assert(ils10R.frontCourseDeg === 96, "SBGR 10R front course is 96°");

                // TEST 2: Theoretical Glide Slope VS Formula
                console.log("\n--- TEST 2: GS VS Formula ---");
                const vs140 = calculate_gs_vs(140, 3.0);
                // 140 * 101.27 * tan(3 deg) = 14177.8 * 0.05240777928 = ~743.03
                assert(Math.abs(vs140 - 743.03) < 1.0, `VS at 140kt is ~743 ft/min (got ${vs140.toFixed(2)})`);
                const vs160 = calculate_gs_vs(160, 3.0);
                assert(Math.abs(vs160 - 849.18) < 1.0, `VS at 160kt is ~849 ft/min (got ${vs160.toFixed(2)})`);

                // TEST 3: Geometry Calculation
                console.log("\n--- TEST 3: Geometry Calculation ---");
                // Aircraft 10 NM north of SBSP on the 170° approach centerline
                // 170° inbound means approaching from North (bearing 350° from threshold)
                // Threshold SBSP 17R is roughly at deltaLat 0.015, deltaLon -0.003
                const geomCenter = calculateILSGeometry(0.18, 0, 0, 0, 170);
                assert(geomCenter.along_track_nm > 0, "A/C to the north has along_track_nm > 0");
                assert(geomCenter.distance_nm > 10, "Distance is > 10 NM");

                // TEST 4: Full ILS Vectoring Sequence (Arm -> LOC Capt -> LOC Track -> GS Arm -> GS Capt -> GS Track -> Flare -> Touchdown -> Squawk 2000)
                console.log("\n--- TEST 4: Full ILS Vectoring Sequence ---");
                const ac = new Aeronave("GLO1234", "B738", 0.20, -0.04, 140, 160, "040", "ILS", "SBSP");
                ac.pistaAtribuida = "17R";
                ac.assigned_runway = "17R";
                ac.modoLNAV = false; // Vectoring mode
                ac.proaDestino = 140; // 30° intercept angle to 170°
                ac.nivAutorizado = "ILS";
                ac.cleared_level = "ILS";
                ac.ils_authorized = true;
                ac.squawk = "4321";

                const rILS = getRunwayILS(ac);
                console.log("rILS:", JSON.stringify(rILS));
                const geomInit = rILS ? calculateILSGeometry(ac.deltaLat, ac.deltaLon, rILS.threshold.deltaLat, rILS.threshold.deltaLon, rILS.front_course_deg) : null;
                console.log("geomInit:", JSON.stringify(geomInit));

                let locArmed = false;
                let locCaptured = false;
                let locTracked = false;
                let gsArmed = false;
                let gsCaptured = false;
                let gsTracked = false;
                let flared = false;
                let touchedDown = false;
                let squawk2000StrictlyAtTouchdown = false;
                let squawkPremature = false;

                const dt = 0.5; // 0.5s time step
                let simTime = 0;
                const maxSimTime = 600; // max 10 minutes simulation

                while (simTime < maxSimTime && !ac.pousou && !ac.on_ground) {
                    ac.atualizar(dt);
                    simTime += dt;

                    // Monitor state progression
                    if (ac.autopilot.loc_armed) locArmed = true;
                    if (ac.autopilot.loc_captured) locCaptured = true;
                    if (ac.autopilot.loc_tracked) locTracked = true;

                    // Check that GS is NOT armed before LOC is tracked
                    if (ac.autopilot.gs_armed && !locTracked) {
                        throw new Error("GS armed prematurely before LOC was tracked!");
                    }
                    if (ac.autopilot.gs_armed) gsArmed = true;
                    if (ac.autopilot.gs_captured) gsCaptured = true;
                    if (ac.autopilot.gs_tracked) gsTracked = true;

                    // Check squawk: MUST NOT be 2000 before touchdown!
                    if (ac.squawk === "2000" && !ac.on_ground && ac.autopilot.vertical_mode !== ILS_VERTICAL_MODES.TOUCHDOWN) {
                        squawkPremature = true;
                    }

                    if (ac.autopilot.vertical_mode === ILS_VERTICAL_MODES.FLARE) {
                        flared = true;
                    }

                    if (ac.on_ground || ac.autopilot.vertical_mode === ILS_VERTICAL_MODES.TOUCHDOWN) {
                        touchedDown = true;
                        if (ac.squawk === "2000") {
                            squawk2000StrictlyAtTouchdown = true;
                        }
                        break;
                    }
                }

                assert(locArmed, "Localizer armed (LOC_ARM)");
                assert(locCaptured, "Localizer captured (LOC_CAPTURE)");
                assert(locTracked, "Localizer tracked (LOC_TRACK)");
                assert(gsArmed, "Glide Slope armed (GS_ARM) after LOC_TRACK");
                assert(gsCaptured, "Glide Slope captured (GS_CAPTURE) from below");
                assert(gsTracked, "Glide Slope tracked (GS_TRACK)");
                assert(flared, "Flare executed near ground (FLARE)");
                assert(touchedDown, "Touchdown detected physically on runway");
                assert(!squawkPremature, "Transponder 2000 did NOT trigger prematurely");
                assert(squawk2000StrictlyAtTouchdown, "Transponder 2000 triggered strictly on touchdown");

                // TEST 5: Negative Test - Vectoring without ILS authorization
                console.log("\n--- TEST 5: Negative Test - No ILS Authorization ---");
                const acNoAuth = new Aeronave("TAM3344", "A320", 0.20, -0.04, 140, 160, "040", "040", "SBSP");
                acNoAuth.pistaAtribuida = "17R";
                acNoAuth.assigned_runway = "17R";
                acNoAuth.modoLNAV = false;
                acNoAuth.proaDestino = 140;
                acNoAuth.nivAutorizado = "040";
                acNoAuth.cleared_level = "040";
                acNoAuth.ils_authorized = false;

                // Simulate for 60 seconds
                for (let t = 0; t < 60; t += 0.5) {
                    acNoAuth.atualizar(0.5);
                }
                assert(!acNoAuth.autopilot.loc_armed, "LOC never armed without authorization");
                assert(!acNoAuth.autopilot.loc_captured, "LOC never captured without authorization");
                assert(acNoAuth.proaDestino === 140, "Heading remained 140°");

                // TEST 6: Negative Test - Aircraft above Glide Slope
                console.log("\n--- TEST 6: Negative Test - Above Glide Slope ---");
                const acAbove = new Aeronave("GLO5566", "B738", 0.08, -0.002, 170, 140, "060", "ILS", "SBSP");
                acAbove.pistaAtribuida = "17R";
                acAbove.assigned_runway = "17R";
                acAbove.modoLNAV = false;
                acAbove.proaDestino = 170;
                acAbove.proa = 170;
                acAbove.nivAutorizado = "ILS";
                acAbove.cleared_level = "ILS";
                acAbove.ils_authorized = true;
                acAbove.altitude_before_ils = 6000;
                acAbove.alt = 6000;
                acAbove.flAtualNum = 60;

                // Force LOC tracked to allow GS evaluation
                acAbove.autopilot.lateral_mode = ILS_LATERAL_MODES.LOC_TRACK;
                acAbove.autopilot.loc_tracked = true;

                // Step simulation
                for (let t = 0; t < 10; t += 0.5) {
                    acAbove.atualizar(0.5);
                }
                assert(acAbove.autopilot.gs_armed === true, "GS armed waiting for beam");
                assert(acAbove.autopilot.gs_captured === false, "GS NOT captured because aircraft is above the beam");
                assert(acAbove.alt >= 5900, "Aircraft maintains level flight without diving");

                // TEST 7: Negative Test - Intercept angle > 45°
                console.log("\n--- TEST 7: Negative Test - Intercept angle > 45° ---");
                const acExcessiveAngle = new Aeronave("AZU7788", "B738", 0.20, -0.04, 80, 160, "040", "ILS", "SBSP");
                acExcessiveAngle.pistaAtribuida = "17R";
                acExcessiveAngle.assigned_runway = "17R";
                acExcessiveAngle.modoLNAV = false;
                acExcessiveAngle.proaDestino = 80; // 90° intercept angle to 170° (exceeds 45°)
                acExcessiveAngle.nivAutorizado = "ILS";
                acExcessiveAngle.cleared_level = "ILS";
                acExcessiveAngle.ils_authorized = true;

                for (let t = 0; t < 20; t += 0.5) {
                    acExcessiveAngle.atualizar(0.5);
                }
                assert(!acExcessiveAngle.autopilot.loc_captured, "LOC NOT captured with 90° intercept angle (> 45° limit)");

                // TEST 8: Radar Tag Display
                console.log("\n--- TEST 8: Radar Tag Display ---");
                const acTag = new Aeronave("TAM1234", "B738", 0.1, 0, 170, 160, "040", "ILS", "SBSP");
                acTag.nivAutorizado = "ILS";
                acTag.cleared_level = "ILS";
                acTag.textoLivre = "HDG170"; // user had typed something before

                // Check Line 4 logic from render.js:
                const textoLinha4 = (acTag.nivAutorizado === "ILS" || acTag.cleared_level === "ILS") ? "" : (acTag.textoLivre || "");
                assert(textoLinha4 === "", "Tag Line 4 is strictly empty (\"\") when cleared for ILS");
                assert(acTag.nivAutorizado === "ILS", "Cleared level field displays strictly \"ILS\"");

                // TEST 9: No 360 Orbit during ILS Tracking
                console.log("\n--- TEST 9: No 360 Orbit during ILS Tracking ---");
                const acTrack = new Aeronave("AZU9999", "A320", 0.18, -0.02, 160, 150, "040", "ILS", "SBSP");
                acTrack.pistaAtribuida = "17R";
                acTrack.cleared_level = "ILS";
                acTrack.nivAutorizado = "ILS";
                acTrack.autopilot.ils_authorized = true;
                acTrack.autopilot.lateral_mode = "LOC_CAPTURE";
                acTrack.autopilot.loc_captured = true;

                let maxHeadingStep = 0;
                let totalHeadingDelta = 0;
                let prevH = acTrack.proa;

                // Simulate 60 seconds of ILS tracking with dt = 0.5s
                for (let t = 0; t < 60; t += 0.5) {
                    acTrack.atualizar(0.5);
                    let step = Math.abs(acTrack.proa - prevH);
                    if (step > 180) step = 360 - step;
                    if (step > maxHeadingStep) maxHeadingStep = step;
                    totalHeadingDelta += step;
                    prevH = acTrack.proa;
                }

                // Heading should remain stable near 170° (between 160° and 180°)
                assert(acTrack.proa >= 160 && acTrack.proa <= 180, `Proa stayed aligned with 170° (ended at ${acTrack.proa.toFixed(1)}°)`);
                assert(maxHeadingStep < 5.0, `Turn rate was smooth (max step was ${maxHeadingStep.toFixed(2)}°)`);
                console.log(`[PASS] Proa tracked smoothly without any 360° orbit (final proa: ${acTrack.proa.toFixed(1)}°)`);

                // TEST 10: MenuNivel level choices (APP must be absent, VIA must be present)
                console.log("\n--- TEST 10: Level Dropdown Options ---");
                assert(!menuNivelUI.niveis.includes("APP"), "Level menu does NOT contain 'APP'");
                assert(menuNivelUI.niveis.includes("VIA"), "Level menu contains 'VIA'");
                assert(menuNivelUI.niveis.includes("ILS"), "Level menu contains 'ILS'");

                // TEST 11: Full VIA procedural approach (STAR -> IAC step-down lock until blocked -> 3° glidepath -> landing)
                console.log("\n--- TEST 11: VIA Procedural Approach with Step-Down Locks ---");
                const sp032 = state.fixos["SP032"];
                const acVia = new Aeronave("TAM1234", "A320", sp032.deltaLat + 0.04, sp032.deltaLon, 140, 180, "080", "VIA", "SBSP");
                acVia.rota = ["SP032", "KOMGU", "GERSU", "URUTA", "SP139", "SP017", "SBSP"];
                acVia.wpIndex = 0;
                acVia.dest = "SBSP";
                acVia.pistaAtribuida = "17R";
                acVia.assigned_runway = "17R";
                acVia.modoLNAV = true;
                acVia.alt = 8000;
                acVia.flAtualNum = 80;
                acVia.nivAutorizado = "VIA";
                acVia.cleared_level = "VIA";
                acVia.autorizadoProcedimento = true;

                let komguLocked = false;
                let komguNeverBelow5500BeforeBlock = true;
                let gersuLocked = false;
                let gersuNeverBelow4700BeforeBlock = true;
                let urutaLocked = false;
                let sp139Locked = false;
                let glidepathEngaged = false;
                let flaredVia = false;
                let touchedDownVia = false;
                let squawk2000Via = false;

                const dtVia = 0.5;
                let timeVia = 0;
                while (timeVia < 750 && !acVia.pousou && !acVia.on_ground) {
                    acVia.atualizar(dtVia);
                    timeVia += dtVia;

                    const curWp = (acVia.rota && acVia.wpIndex < acVia.rota.length) ? acVia.rota[acVia.wpIndex] : null;
                    if (curWp === "KOMGU") {
                        komguLocked = true;
                        if (acVia.alt < 5450) {
                            komguNeverBelow5500BeforeBlock = false;
                        }
                    }
                    if (curWp === "GERSU" || acVia.hold_altitude_until_waypoint === "GERSU") {
                        gersuLocked = true;
                        if (acVia.alt < 4690) {
                            gersuNeverBelow4700BeforeBlock = false;
                        }
                    }
                    if (curWp === "URUTA") urutaLocked = true;
                    if (curWp === "SP139") sp139Locked = true;
                    if (acVia.descent_mode === 'GLIDEPATH') glidepathEngaged = true;
                    if (acVia.descent_mode === 'FLARE') flaredVia = true;
                    if (acVia.on_ground) touchedDownVia = true;
                    if (acVia.squawk === "2000") squawk2000Via = true;
                }

                assert(komguLocked, "Aircraft transitioned to KOMGU lock");
                assert(komguNeverBelow5500BeforeBlock, "Aircraft held altitude at KOMGU (did not drop below 5500 ft before blocking)");
                assert(gersuLocked, "Aircraft transitioned to GERSU step-down");
                assert(gersuNeverBelow4700BeforeBlock, "Aircraft held altitude at GERSU (did not drop below 4700 ft before blocking)");
                assert(glidepathEngaged, "Aircraft engaged 3° glidepath at FAF");
                assert(squawk2000Via, "Squawk changed to 2000 on final/landing");
                assert(acVia.pousou || acVia.on_ground, "Aircraft completed landing lifecycle on VIA");

                // TEST 12: VIA safety rule (plane vectored at 4000 ft does NOT climb when cleared VIA to a 5000 ft fix)
                console.log("\n--- TEST 12: VIA Safety Rule (Never climb if below restriction) ---");
                const acLow = new Aeronave("GLO5555", "B738", 0.05, -0.05, 140, 160, "040", "040", "SBSP");
                acLow.alt = 4000;
                acLow.flAtualNum = 40;
                acLow.rota = ["GERSU", "URUTA", "SP139", "SP017", "SBSP"];
                acLow.wpIndex = 0;
                acLow.nivAutorizado = "VIA";
                acLow.cleared_level = "VIA";
                acLow.autorizadoProcedimento = true;
                acLow.cleared_approach = true;
                authorize_approach(acLow);

                assert(acLow.target_altitude <= 4000, `Target altitude is capped at current alt (4000 ft) instead of climbing to 5000 ft (got ${acLow.target_altitude})`);
                for (let t = 0; t < 20; t += 0.5) {
                    acLow.atualizar(0.5);
                }
                assert(acLow.alt <= 4050, `Aircraft maintained level flight and did not climb (alt: ${acLow.alt.toFixed(1)} ft)`);

                // TEST 13: SP101 Waypoint Safety Test (Aircraft at SP101 on STAR OGTAL 2A must NOT squawk 2000 or disappear)
                console.log("\n--- TEST 13: SP101 Waypoint Safety (STAR OGTAL 2A) ---");
                const sp101Coords = state.fixos["SP101"];
                assert(sp101Coords !== undefined, "SP101 waypoint exists in state.fixos");
                
                const acSp101 = new Aeronave("TAM3333", "A320", sp101Coords.deltaLat, sp101Coords.deltaLon, 330, 220, "090", "090", "SBSP");
                acSp101.squawk = "4521";
                if (acSp101.transponder) acSp101.transponder.code = "4521";
                acSp101.alt = 9000;
                acSp101.flAtualNum = 90;
                acSp101.rota = ["OGTAL", "SP099", "SP101", "SP032", "KOMGU", "GERSU", "URUTA", "SP139", "SBSP"];
                acSp101.wpIndex = 2; // SP101
                acSp101.wpNome = "SP101";

                // Simulate 30 seconds of flight over/past SP101
                let sp101Triggered2000 = false;
                let sp101PrematureLanding = false;
                for (let t = 0; t < 30; t += 0.5) {
                    acSp101.atualizar(0.5);
                    if (acSp101.squawk === "2000") sp101Triggered2000 = true;
                    if (acSp101.pousou || acSp101.on_ground) sp101PrematureLanding = true;
                }

                assert(!sp101Triggered2000, `Aircraft at SP101 did NOT trigger squawk 2000 (squawk remained ${acSp101.squawk})`);
                assert(!sp101PrematureLanding, "Aircraft at SP101 did NOT prematurely land or disappear (pousou = false, on_ground = false)");
                assert(acSp101.pousou === false, "pousou flag is strictly false");
                assert(!acSp101.on_ground, "on_ground is strictly false");

                // TEST 14: GERSU Altitude Restriction Safety (Never below FL047 before passing GERSU)
                console.log("\n--- TEST 14: GERSU Altitude Restriction Safety (RNPY17R) ---");
                const komguCoords = state.fixos["KOMGU"];
                const gersuCoords = state.fixos["GERSU"];
                assert(gersuCoords !== undefined, "GERSU fix exists in state.fixos");

                // Spawn aircraft at KOMGU at 5500 ft (FL 055), flying towards GERSU on RNAV 17R
                const acGersu = new Aeronave("AZU4455", "E195", komguCoords.deltaLat, komguCoords.deltaLon, 55, 160, "055", "VIA", "SBSP");
                acGersu.dest = "SBSP";
                acGersu.pistaAtribuida = "17R";
                acGersu.assigned_runway = "17R";
                acGersu.modoLNAV = true;
                acGersu.alt = 5500;
                acGersu.flAtualNum = 55;
                acGersu.rota = ["KOMGU", "GERSU", "URUTA", "SP139", "SP017", "SBSP"];
                acGersu.wpIndex = 0;
                acGersu.nivAutorizado = "VIA";
                acGersu.cleared_level = "VIA";
                acGersu.autorizadoProcedimento = true;
                acGersu.cleared_approach = true;
                authorize_approach(acGersu);

                let gersuCrossed = false;
                let droppedBelow4700BeforeCrossing = false;
                let minAltBeforeGersu = 99999;

                // Simulate for 180 seconds (KOMGU -> GERSU is ~5.6 NM, at 160 kt takes ~125 seconds)
                for (let t = 0; t < 180; t += 0.5) {
                    acGersu.atualizar(0.5);

                    // Check if GERSU is still the hold fix
                    const isHoldingGersu = (acGersu.hold_altitude_until_waypoint === "GERSU" || acGersu.hold_altitude_until_waypoint === "KOMGU");
                    if (isHoldingGersu) {
                        minAltBeforeGersu = Math.min(minAltBeforeGersu, acGersu.alt);
                        if (acGersu.alt < 4700) {
                            droppedBelow4700BeforeCrossing = true;
                        }
                        const tagLevel = parseInt(acGersu.nivAtual, 10);
                        if (!isNaN(tagLevel) && tagLevel < 47) {
                            droppedBelow4700BeforeCrossing = true;
                        }
                    } else if (!gersuCrossed && acGersu.hold_altitude_until_waypoint === "URUTA") {
                        gersuCrossed = true;
                    }
                }

                assert(gersuCrossed, "Aircraft successfully sequenced past GERSU to URUTA");
                assert(!droppedBelow4700BeforeCrossing, `Aircraft NEVER dropped below 4700 ft before passing GERSU (min alt was ${minAltBeforeGersu.toFixed(1)} ft)`);
                assert(minAltBeforeGersu >= 4700, `Minimum altitude before GERSU was >= 4700 ft (got ${minAltBeforeGersu.toFixed(1)} ft)`);

                // TEST 15: Extended Glide Slope up to 30 NM (3° Glidepath Angle)
                console.log("\n--- TEST 15: Extended Glide Slope up to 30 NM ---");
                const rwy17R = getRunwayILSData("SBSP", "17R");
                assert(rwy17R.loc_max_distance_nm === 30.0, "LOC max distance is 30 NM");
                assert(rwy17R.gs_max_distance_nm === 30.0, "GS max distance is 30 NM");

                // Position aircraft at 26 NM out on Front Course (170°), altitude 10,000 ft (FL 100)
                const distInitNM = 26.0;
                const dNorthNM = distInitNM * Math.cos((170 - 180) * (Math.PI / 180));
                const dEastNM = distInitNM * Math.sin((170 - 180) * (Math.PI / 180));
                const acInitLat = 0.008617 + (dNorthNM / 60);
                const acInitLon = -0.001658 + (dEastNM / (60 * 0.916));

                const acGS30 = new Aeronave("TAM9988", "A320", acInitLat, acInitLon, 170, 200, "100", "ILS", "SBSP");
                acGS30.pistaAtribuida = "17R";
                acGS30.assigned_runway = "17R";
                acGS30.modoLNAV = false;
                acGS30.proa = 170;
                acGS30.proaDestino = 170;
                acGS30.alt = 10000;
                acGS30.flAtualNum = 100;
                acGS30.altitude_before_ils = 10000;
                acGS30.nivAutorizado = "ILS";
                acGS30.cleared_level = "ILS";
                acGS30.ils_authorized = true;

                let gsCapturedAtLongDistance = false;
                let captureDistanceNM = 0;
                let vsTracked = 0;

                // Simulate flight: at 200 kt, from 26 NM to ~22 NM takes ~75 seconds
                for (let t = 0; t < 100; t += 0.5) {
                    acGS30.atualizar(0.5);

                    if (acGS30.autopilot.gs_captured && !gsCapturedAtLongDistance) {
                        gsCapturedAtLongDistance = true;
                        const rILS = getRunwayILS(acGS30);
                        const geom = calculateILSGeometry(acGS30.deltaLat, acGS30.deltaLon, rILS.threshold.deltaLat, rILS.threshold.deltaLon, rILS.front_course_deg);
                        captureDistanceNM = geom.along_track_nm;
                    }

                    if (acGS30.autopilot.gs_tracked) {
                        vsTracked = acGS30.targetVS;
                    }
                }

                assert(gsCapturedAtLongDistance, "Glide Slope captured beyond standard 20 NM limit");
                assert(captureDistanceNM > 21.0 && captureDistanceNM <= 26.0, `GS intercepted between 21 and 26 NM (intercepted at ${captureDistanceNM.toFixed(1)} NM)`);
                assert(acGS30.autopilot.gs_tracked, "Glide Slope tracked in GS_TRACK mode");
                const expectedGSVS = calculate_gs_vs(acGS30.groundSpeed || acGS30.vel, 3.0);
                assert(Math.abs(Math.abs(vsTracked) - expectedGSVS) < 150, `Target VS matches 3.0° descent angle for GS (${expectedGSVS.toFixed(0)} ft/min, got ${vsTracked.toFixed(0)})`);
                assert(acGS30.descent_mode === 'GLIDEPATH', "Aircraft in GLIDEPATH descent mode");
                assert(acGS30.verticalMode === 'G/S', "Aircraft verticalMode is G/S");

                console.log("\nALL TESTS PASSED SUCCESSFULLY!");
                document.getElementById('output').innerHTML = '<h2 style="color: green;">ALL TESTS PASSED!</h2>';

                // Post results to python server
                fetch('/test-results', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ success: true, results, logs: capturedLogs })
                }).catch(err => console.log("Post results:", err));

            } catch (error) {
                console.error("Test failed:", error);
                document.getElementById('output').innerHTML = `<h2 style="color: red;">TEST FAILED: ${error.message}</h2>`;
                fetch('/test-results', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ success: false, error: error.message, stack: error.stack, logs: capturedLogs })
                }).catch(err => console.log("Post error:", err));
            }
        }

        window.onload = runTests;
    </script>
</body>
</html>
