<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Simulador SBXP</title>
</head>
<body>
    <!-- BOTÃO HAMBÚRGUER E PAINEL RETRÁTIL: VÍDEO-MAPA E BRILHO -->
    <button id="btnHamburgerDrawer" class="btn-hamburger-atc" title="Menu Vídeo-Mapa e Brilho">&#9776;</button>
    <div id="painelVideoMapaDrawer" class="drawer-atc recolhido"></div>

    <!-- BOTÃO E PAINEL DE CONTROLE DE FLUXO ATC -->
    <button id="btnToggleFluxo" class="btn-topo-fluxo" title="Controle de Fluxo e Esteiras">
        <svg class="icone-relogio" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Fluxo</span>
    </button>

    <div id="painelFluxo" class="painel-fluxo-flutuante" style="display: none;">
        <div class="cabecalho-painel-fluxo">
            <div class="cabecalho-fluxo-titulo">
                <svg class="icone-relogio" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <h3>CONTROLE DE FLUXO</h3>
            </div>
            <div class="cabecalho-fluxo-acoes">
                <button id="btnPauseSimulacao" class="btn-pause-fluxo" title="Pausar Simulação">
                    <svg id="iconePauseSimulacao" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="5" y="4" width="4" height="16" rx="1"></rect>
                        <rect x="15" y="4" width="4" height="16" rx="1"></rect>
                    </svg>
                </button>
                <button id="btnAdicionarFluxo" class="btn-adicionar-fluxo" title="Adicionar nova esteira de tráfego">+ FLUXO</button>
                <button id="btnFecharFluxo" class="btn-fechar-fluxo" title="Fechar painel [Esc]">✕</button>
            </div>
        </div>
        
        <div class="abas-fluxo">
            <button id="btnAbaARR" class="aba-fluxo ativa">ARR</button>
            <button id="btnAbaDEP" class="aba-fluxo">DEP</button>
        </div>

        <div id="conteudoARR">
            <div id="containerEsteiras"></div>
        </div>

        <div id="conteudoDEP" style="display: none;">
            <div class="dep-controles-superiores">
                <select id="selAerodromoDep" class="sel-fixo">
                    <option value="SBGR">SBGR</option>
                    <option value="SBKP">SBKP</option>
                    <option value="SBSP">SBSP</option>
                </select>
                <button id="btnGerarDEP" class="btn-adicionar-fluxo" style="margin-left:5px;">+ GERAR</button>
                <button id="btnLimparFilaDEP" class="btn-remover-esteira" title="Limpar aeronaves aguardando" style="margin-left:auto; font-size:12px; width:auto; padding:0 5px;">LIMPAR</button>
            </div>
            <div class="dep-linha-intervalo" style="display:flex; align-items:center; justify-content:space-between; margin: 4px 0; padding: 4px 6px; background: rgba(0,0,0,0.25); border-radius: 4px;">
                <label for="selIntervaloDep" style="font-size: 11px; color: #aaa;">INTERVALO DEP:</label>
                <select id="selIntervaloDep" class="sel-fixo" style="width: auto; padding: 1px 6px; font-size: 11px; color: #00ffff; background: #222; border: 1px solid #444;">
                    <option value="1">1 min</option>
                    <option value="2">2 min</option>
                    <option value="3">3 min</option>
                    <option value="4">4 min</option>
                    <option value="5">5 min</option>
                    <option value="6">6 min</option>
                    <option value="7">7 min</option>
                    <option value="8">8 min</option>
                    <option value="9">9 min</option>
                    <option value="10">10 min</option>
                </select>
            </div>
            <div class="dep-auto-toggle" style="display:flex; flex-direction:column; gap:5px; margin: 6px 0 8px 0; padding: 6px 8px; background: rgba(0,0,0,0.35); border-radius: 4px; border: 1px solid rgba(0, 255, 255, 0.2);">
                <label style="font-size: 11px; color: #00ffff; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="chkAutoSpawnDEP" style="cursor: pointer;">
                    GERAÇÃO AUTOMÁTICA (DEP)
                </label>
                <label style="font-size: 11px; color: #00ffff; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="chkAutoDEP" style="cursor: pointer;">
                    DECOLAGEM AUTOMÁTICA (DEP)
                </label>
            </div>
            <div id="containerFilaDEP" class="fila-dep"></div>
        </div>
 <!--   
    -->
        <div class="divisor-painel"></div>
        <div class="secao-velocidade">
            <div class="linha-fluxo">
                <label for="sliderVelocidade">VELOCIDADE:</label>
                <span id="labelVelocidade">1x</span>
            </div>
            <input type="range" id="sliderVelocidade" min="1" max="10" step="0.5" value="1">
            <div class="ticks-velocidade">
                <span>1x</span>
                <span>2x</span>
                <span>3x</span>
                <span>4x</span>
                <span>5x</span>
                <span>6x</span>
                <span>7x</span>
                <span>8x</span>
                <span>9x</span>
                <span>10x</span>
            </div>
        </div>
    </div>

    <!-- BOTÃO E PAINEL DE CONTROLE DE VENTO ATC -->
    <button id="btnToggleVento" class="btn-topo-vento" title="Configurar Vento Global e de Cabeceiras">☁ VENTO ATC</button>
    <div id="painelVento" class="painel-vento-flutuante" style="display: none;"></div>

    <!-- BOTÃO E PAINEL DE ANOTAÇÕES DO INSTRUTOR [P] -->
    <button id="btnToggleAnotacao" class="btn-topo-anotacao" title="Painel de Anotações do Instrutor [P]">✏ ANOTAÇÃO</button>
    <div id="painelAnotacoes" class="painel-anotacao-flutuante" style="display: none;"></div>

    <input type="text" id="inputTextoLivre" autocomplete="off" spellcheck="false" style="position: absolute; display: none; background-color: #ffffff; color: #000000; border: none; font-family: monospace; font-size: 12px; outline: none; padding: 0; z-index: 101; width: 80px; text-transform: uppercase;">
    <canvas id="telaRadar"></canvas>
    <canvas id="canvasAnotacoes"></canvas>

    <script type="module" src="src/core/main.js?v=2.2"></script>
</body>
</html>
